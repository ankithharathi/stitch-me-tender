<body>
<div id="game"></div>
<script>
const W = 540, H = 960;
// Render at 2x (or ?hires=N) so painted art stays sharp on phones; the world stays 540x960.
const RES = (() => { const q = new URLSearchParams(location.search).get('hires'); return q ? Math.max(1, Math.min(4, +q)) : Math.min(2, Math.max(1, Math.round(window.devicePixelRatio || 1))); })();
const MON_SPRITES = ['mon_0', 'mon_1', 'mon_2', 'mon_3', 'mon_4', 'mon_5', 'mon_6', 'mon_7'];
const ART = [...MON_SPRITES, 'groom', 'maw', 'thief', 'wrangler_0', 'wrangler_1', 'wrangler_2', 'capsule_machine', 'bg_title', 'bg_stage', 'bg_booth', 'bg_wedding', 'bg_win'];
const HAS = (k) => !!(window.game && game.textures.exists(k));
const N = {
  pink: 0xff3d8b, cyan: 0x3df2ff, lime: 0xb6ff3d, gold: 0xffd23f, ink: 0x160b1e, white: 0xffffff,
  red: 0xff3b3b, ice: 0x9fe8ff, teal: 0x12303a, orange: 0xe0703a, plum: 0x3a1d4a, plum2: 0x2a1236,
  sand: 0xd9a066, sand2: 0xb88050, skin: 0xb9e6a8, dim: 0x4a3a5a,
};
const SYMS = ['moon', 'bone', 'flame', 'drop', 'star', 'eye'];
const SYMCOL = { moon: 0xfff1a8, bone: 0xf3ead7, flame: 0xff8a3d, drop: 0xb6ff3d, star: 0xffd23f, eye: 0x3df2ff, wild: 0xff3d8b, ice: 0x9fe8ff };
const RAR = [N.cyan, N.pink, N.gold];
const MCOLS = [0xff8fb1, 0x8fe3a0, 0xb59cff, 0xffc46b, 0x7fd6ff, 0xff9a7a, 0xd8ff7a, 0xe7a8ff];

const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[rnd(a.length)];
const shuffle = (a) => Phaser.Utils.Array.Shuffle(a);

// ---------------- run state ----------------
const S = { round: 0, hats: 5, maxHats: 5, deck: [], entourage: [], tokens: 0, muted: false, auto: false };
const mkCard = (sym, solid, ghost, rarity = 0) => ({ sym, solid, ghost, rarity });
function startDeck() {
  const r = () => pick(SYMS);
  return [mkCard(r(), 1, 0), mkCard(r(), 1, 0), mkCard(r(), 1, 0), mkCard(r(), 2, 0), mkCard(r(), 2, 0),
    mkCard(r(), 1, 1), mkCard(r(), 1, 1), mkCard(r(), 1, 2), mkCard('ice', 0, 0)];
}
function newLook(size = 1, avoid = []) {
  const m = shuffle(SYMS.slice()).slice(0, 2);
  const pool = MON_SPRITES.filter((k) => !avoid.includes(k));
  return { sprite: pick(pool.length ? pool : MON_SPRITES), color: pick(MCOLS), eyes: 1 + rnd(3), stalks: Math.random() < 0.4, horns: rnd(3), spots: Math.random() < 0.6, size, markers: m, wide: 0.9 + Math.random() * 0.3 };
}
function resetRun() { S.round = 0; S.hats = 5; S.deck = startDeck(); S.entourage = []; S.tokens = 0; }
resetRun();

const RIVALS = [
  { kind: 'kid', count: 2, zoneMax: 7, zoneSize: 3, size: 0.85, intent: () => (Math.random() < 0.7 ? { k: 'fang', n: 1 } : { k: 'snow', n: 2 }) },
  { kind: 'rodeo', count: 3, zoneMax: 8, zoneSize: 3, size: 0.8, intent: () => (Math.random() < 0.5 ? { k: 'fang', n: 1 + rnd(2) } : { k: 'snow', n: 2 }) },
  { kind: 'bride', count: 1, zoneMax: 11, zoneSize: 2, size: 1.45, intent: (t) => (t % 2 === 0 ? { k: 'fang', n: 2 } : { k: 'snow', n: 2 }) },
];

// ---------------- audio ----------------
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'square', v = 0.08, slide = 0, delay = 0) {
  if (S.muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.1, delay = 0, hp = 800) {
  if (S.muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, b = a.createBuffer(1, Math.max(1, a.sampleRate * d), a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = hp; s.buffer = b; g.gain.value = v;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  laugh() { tone(160, 0.22, 'sawtooth', 0.09, 120); [0, 1, 2].forEach((i) => tone(260 - i * 30, 0.14, 'square', 0.08, -60, 0.3 + i * 0.18)); },
  buzz() { tone(60, 0.25, 'sawtooth', 0.05); tone(120, 0.25, 'square', 0.02); },
  flick() { noise(0.08, 0.08, 0, 2500); },
  tick(i) { tone(500 + i * 70, 0.06, 'triangle', 0.1); },
  ghost() { tone(900, 0.04, 'sine', 0.06); tone(1100, 0.04, 'sine', 0.05, 0, 0.06); },
  fizzle() { noise(0.15, 0.06, 0, 3000); tone(300, 0.15, 'sine', 0.05, -200); },
  beat(f) { tone(58, 0.11, 'sine', 0.3 * f, -18); tone(52, 0.11, 'sine', 0.24 * f, -18, 0.16); },
  smooch() { tone(700, 0.07, 'sine', 0.18, 700); tone(1500, 0.09, 'sine', 0.12, -800, 0.08); noise(0.05, 0.06, 0.07, 3000); },
  chomp() { noise(0.12, 0.3, 0, 200); tone(110, 0.25, 'square', 0.15, -60); noise(0.1, 0.25, 0.14, 300); },
  sob() { [0, 1, 2].forEach((i) => tone(520 - i * 40, 0.25, 'sine', 0.07, -140, i * 0.28)); },
  coin() { tone(1300, 0.08, 'square', 0.06); tone(1750, 0.12, 'square', 0.05, 0, 0.06); },
  crank() { for (let i = 0; i < 6; i++) noise(0.03, 0.12, i * 0.07, 1500); },
  pop(r) { tone(400 + r * 250, 0.12, 'triangle', 0.12, 500); [0, 1, 2].slice(0, r + 1).forEach((i) => tone(880 * Math.pow(1.25, i + r), 0.15, 'triangle', 0.08, 0, 0.12 + i * 0.08)); },
  ice() { [0, 1, 2].forEach((i) => tone(1800 - i * 300, 0.1, 'sine', 0.06, 0, i * 0.05)); },
  block() { tone(260, 0.07, 'square', 0.09); tone(330, 0.09, 'square', 0.07, 0, 0.05); },
  hurt() { tone(200, 0.2, 'sawtooth', 0.1, -120); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, 0, i * 0.12)); },
  lose() { [400, 330, 260, 180].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, -30, i * 0.18)); },
};
// calliope waltz loop
let musicOn = false;
function startMusic() {
  if (musicOn) return; musicOn = true;
  const chords = [[130.8, 261.6, 329.6], [98, 246.9, 293.7], [110, 220, 261.6], [87.3, 220, 261.6]];
  const mel = [659, 784, 659, 587, 523, 587, 659, 523, 440, 523, 587, 494, 523, 659, 784, 880, 784, 659, 587, 523, 494, 523, 587, 523];
  let beat = 0;
  setInterval(() => {
    if (S.muted) { beat++; return; }
    const bar = Math.floor(beat / 3) % 4, b = beat % 3, ch = chords[bar];
    if (b === 0) tone(ch[0], 0.3, 'triangle', 0.035); else { tone(ch[1], 0.12, 'square', 0.012); tone(ch[2], 0.12, 'square', 0.012); }
    tone(mel[beat % mel.length], 0.22, 'triangle', 0.02);
    beat++;
  }, 380);
}

// ---------------- drawing ----------------
function heart(g, x, y, s, color, alpha = 1) {
  g.fillStyle(color, alpha); g.fillCircle(x - s * 0.5, y - s * 0.2, s * 0.52); g.fillCircle(x + s * 0.5, y - s * 0.2, s * 0.52);
  g.fillTriangle(x - s * 1.0, y - s * 0.02, x + s * 1.0, y - s * 0.02, x, y + s * 1.05);
}
function star(g, x, y, s, color) { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.45 : s; pts.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r }); } g.fillStyle(color); g.fillPoints(pts, true); }
function drawSym(g, sym, x, y, s, bg = N.plum2, alpha = 1) {
  const col = SYMCOL[sym];
  g.fillStyle(col, alpha);
  if (sym === 'moon') { g.fillCircle(x, y, s); g.fillStyle(bg); g.fillCircle(x + s * 0.5, y - s * 0.28, s * 0.82); }
  else if (sym === 'bone') { g.fillRect(x - s * 0.7, y - s * 0.22, s * 1.4, s * 0.44); [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([a, b]) => g.fillCircle(x + a * s * 0.72, y + b * s * 0.24, s * 0.3)); }
  else if (sym === 'flame') { g.fillCircle(x, y + s * 0.28, s * 0.6); g.fillTriangle(x - s * 0.58, y + s * 0.15, x + s * 0.58, y + s * 0.15, x + s * 0.12, y - s * 1.0); g.fillStyle(0xffe08a, alpha); g.fillCircle(x, y + s * 0.42, s * 0.3); }
  else if (sym === 'drop') { g.fillCircle(x, y + s * 0.3, s * 0.62); g.fillTriangle(x - s * 0.58, y + s * 0.12, x + s * 0.58, y + s * 0.12, x, y - s * 0.95); g.fillStyle(N.white, 0.6 * alpha); g.fillCircle(x - s * 0.2, y + s * 0.2, s * 0.14); }
  else if (sym === 'star') star(g, x, y, s, col);
  else if (sym === 'eye') { g.fillStyle(N.white, alpha); g.fillEllipse(x, y, s * 2.1, s * 1.25); g.fillStyle(col, alpha); g.fillCircle(x, y, s * 0.48); g.fillStyle(N.ink, alpha); g.fillCircle(x, y, s * 0.22); }
  else if (sym === 'wild') { heart(g, x, y, s * 0.9, N.pink, alpha); heart(g, x, y + s * 0.05, s * 0.62, N.gold, alpha); heart(g, x, y + s * 0.1, s * 0.34, N.cyan, alpha); }
  else if (sym === 'ice') { g.lineStyle(Math.max(2, s * 0.22), col, alpha); for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; g.lineBetween(x - Math.cos(a) * s, y - Math.sin(a) * s, x + Math.cos(a) * s, y + Math.sin(a) * s); } g.fillCircle(x, y, s * 0.22); }
}
function flamePip(g, x, y, s, ghost) {
  if (!ghost) { drawSym(g, 'flame', x, y, s); return; }
  g.fillStyle(0xff8a3d, 0.22); g.fillCircle(x, y + s * 0.28, s * 0.6); g.fillTriangle(x - s * 0.58, y + s * 0.15, x + s * 0.58, y + s * 0.15, x + s * 0.12, y - s * 1.0);
  g.lineStyle(2, 0xffb070, 0.95); g.strokeCircle(x, y + s * 0.28, s * 0.6); g.lineBetween(x - s * 0.5, y, x + s * 0.12, y - s * 1.0); g.lineBetween(x + s * 0.5, y, x + s * 0.12, y - s * 1.0);
}
function glowRect(g, x, y, w, h, r, color, lw = 3) {
  g.lineStyle(lw * 5, color, 0.08); g.strokeRoundedRect(x, y, w, h, r);
  g.lineStyle(lw * 2.5, color, 0.2); g.strokeRoundedRect(x, y, w, h, r);
  g.lineStyle(lw, color, 1); g.strokeRoundedRect(x, y, w, h, r);
}
function glowCircle(g, x, y, r, color, lw = 3) {
  g.lineStyle(lw * 5, color, 0.08); g.strokeCircle(x, y, r);
  g.lineStyle(lw * 2.5, color, 0.2); g.strokeCircle(x, y, r);
  g.lineStyle(lw, color, 1); g.strokeCircle(x, y, r);
}
function hatIcon(g, x, y, s, color = N.ink, band = N.pink) {
  g.fillStyle(color); g.fillRect(x - s * 0.55, y - s * 1.1, s * 1.1, s * 1.1); g.fillEllipse(x, y, s * 1.9, s * 0.45);
  g.fillStyle(band); g.fillRect(x - s * 0.55, y - s * 0.35, s * 1.1, s * 0.22);
}
function lipsIcon(g, x, y, s, color = N.pink) {
  g.fillStyle(N.ink); g.fillEllipse(x, y, s * 2.3, s * 1.35);
  g.fillStyle(color); g.fillEllipse(x - s * 0.45, y - s * 0.22, s * 1.1, s * 0.6); g.fillEllipse(x + s * 0.45, y - s * 0.22, s * 1.1, s * 0.6); g.fillEllipse(x, y + s * 0.25, s * 1.8, s * 0.65);
  g.lineStyle(Math.max(2, s * 0.12), N.ink); g.lineBetween(x - s * 0.95, y + 0.02 * s, x + s * 0.95, y + 0.02 * s);
}
function teethIcon(g, x, y, s) {
  g.fillStyle(N.ink); g.fillEllipse(x, y, s * 2.3, s * 1.5); g.fillStyle(0x8a1030); g.fillEllipse(x, y, s * 2.0, s * 1.2);
  g.fillStyle(N.white); for (let i = -2; i <= 2; i++) { g.fillTriangle(x + i * s * 0.36 - s * 0.17, y - s * 0.55, x + i * s * 0.36 + s * 0.17, y - s * 0.55, x + i * s * 0.36, y - s * 0.12); g.fillTriangle(x + i * s * 0.36 - s * 0.17, y + s * 0.55, x + i * s * 0.36 + s * 0.17, y + s * 0.55, x + i * s * 0.36, y + s * 0.12); }
}

// ---------------- painted UI layer ----------------
// Painted UI sprites live in assets/sprites/ui_<name>.png. Every helper below returns null (or takes the vector
// path) when a file is missing, so the game looks exactly like the vector build until the art lands.
const UI_NAMES = ['sym_moon', 'sym_bone', 'sym_flame', 'sym_drop', 'sym_star', 'sym_eye', 'sym_wild', 'sym_ice', 'flame_ghost',
  'hat', 'lips', 'fang', 'tent', 'token', 'hand', 'robot', 'sound', 'mute',
  'btn_smooch', 'btn_end', 'btn_next', 'btn_replay', 'bubble', 'card_back',
  'frame_common', 'frame_rare', 'frame_legendary',
  'meter', 'jar', 'capsule_common', 'capsule_rare', 'capsule_legendary', 'fx_tear', 'heart', 'heart_empty', 'fx_spark'];
const UI_ART = UI_NAMES.map((n) => 'ui_' + n);
const HASUI = (name) => HAS('ui_' + name);
const RARN = ['common', 'rare', 'legendary'];
// Layout of the painted UI in world px (540x960 world). These are the knobs to tune once the real art lands.
const UI_LAYOUT = {
  hand: { w: 62, h: 78, ox: 0.5, oy: 1, tipY: -6 }, // hint hand box; painted hand points down, (ox, oy) is the fingertip, placed at tipY
  topIcon: 42, topDisc: 0.35,                       // robot / speaker icon box; alpha of the dark disc kept behind them
  tent: 40,                                         // round progress tents
  hat: 30, hatY: 42, pillAlpha: 0.55,               // health hats inside the pill, pill fill alpha
  lips: [48, 36],                                   // energy lips box (w, h)
  devHeart: 15, devHeartY: 584,                     // entourage devotion hearts
  deck: [34, 46], deckXY: [512, 636], deckStep: [1.5, -4], // deck pile card backs, base position, per-card offset
  badgeSym: 22,                                     // marker sprites on the monster belly badge
  card: { w: 112, h: 152, sym: 58, symY: -16, ice: 62, pip: 24, pipY: 40, pipGap: 27, spark: 16 },
  // love-tester tube: art spans [top - padTop, bottom + padBot]; the top capFrac of the image (skull cap) keeps its aspect,
  // the rest stretches. Segment fills are fillW wide at x + fillDX; slotAlpha is the empty-segment shade drawn on the glass.
  meter: { w: 38, padTop: 10, padBot: 8, capFrac: 0.16, fillW: 14, fillDX: 0, slotAlpha: 0.45, zoneAlpha: 0.6, heartDX: 25, heart: 11 },
  bubble: { padX: 16, h: 46, dy: -2, icon: 20, iconDY: -3, gap: 22 }, // intent bubble (stretched to 30 + n*20 + padX wide)
  btnPad: 6,                                        // painted round buttons fill a (2r + 2*btnPad) box
  jar: { x: 70, y: 655, w: 100, h: 150, coin: 21, coinBot: 24, coinStep: [20, 22] }, // booth token jar; coin rows start coinBot above the jar's bottom edge
  capsule: 72, ghostFlame: 34,
  moodHearts: [24, 18, 13], sweat: [14, 20],        // smitten hearts and nervous sweat on painted monsters
  logo: { lips: [112, 80], heart: 104, teeth: [116, 84] }, // title neon sign
};
// Painted stand-ins for the generated particle textures: [ui name, world px at scale 1], matching the vector texture at 1/RES.
const PART_ART = { pHeart: ['heart', 24], pSpark: ['fx_spark', 16], pTear: ['fx_tear', 18], pFlame: ['sym_flame', 20], pIce: ['sym_ice', 24], pCoin: ['token', 24], pHat: ['hat', 32] };
const UI_DIM = 0x555566;

// Fit an image inside a w x h world box, aspect kept (painted sources have arbitrary pixel sizes).
function fitImg(im, w, h = w) { im.setScale(Math.min(w / im.width, h / im.height)); return im; }
// A painted UI sprite fitted in a w x h box, or null when ui_<name> is missing.
// opts: origin [x, y], tint, alpha, depth, parent (Container to add it to)
function uiImg(scene, name, x, y, w, h = w, opts = {}) {
  if (!HASUI(name)) return null;
  const im = fitImg(scene.add.image(x, y, 'ui_' + name), w, h);
  if (opts.origin) im.setOrigin(opts.origin[0], opts.origin[1]);
  if (opts.tint !== undefined) im.setTint(opts.tint);
  if (opts.alpha !== undefined) im.setAlpha(opts.alpha);
  if (opts.depth !== undefined) im.setDepth(opts.depth);
  if (opts.parent) opts.parent.add(im);
  return im;
}
// Painted marker symbol (moon, bone, flame, drop, star, eye, wild, ice) in a box x box square.
function symImg(scene, sym, x, y, box, opts) { return uiImg(scene, 'sym_' + sym, x, y, box, box, opts); }
// Dim / spent / lost state as tint + alpha (the vector build used a dark colour).
function uiDim(im, on, alpha = 0.5, tint = UI_DIM) { if (!im) return im; if (on) im.setTint(tint).setAlpha(alpha); else im.clearTint().setAlpha(1); return im; }
// Soft glow and greyscale on a painted sprite. WebGL only: Canvas has no preFX, so these quietly do nothing there.
function uiGlow(im, color, strength = 3) { if (!im || !im.preFX) return null; try { im.preFX.setPadding(14); return im.preFX.addGlow(color, strength, 0, false, 0.1, 12) || null; } catch (e) { return null; } }
function uiUnglow(im, fx) { if (im && im.preFX && fx) { try { im.preFX.remove(fx); } catch (e) {} } }
function uiGrey(im, alpha = 0.75) {
  if (!im) return im; im.setAlpha(alpha);
  let ok = false; if (im.preFX) { try { const cm = im.preFX.addColorMatrix(); if (cm) { cm.grayscale(1); ok = true; } } catch (e) {} }
  if (!ok) im.setTint(0x9a9aaa);
  return im;
}
// Particle-sized image (pHat, pCoin...): the painted version at the vector texture's world size times mul, else the vector texture.
function pImage(scene, x, y, pkey, mul = 1) {
  const pa = PART_ART[pkey];
  if (pa && HASUI(pa[0])) { const im = scene.add.image(x, y, 'ui_' + pa[0]); return im.setScale(mul * pa[1] / Math.max(im.width, im.height)); }
  return scene.add.image(x, y, pkey).setScale(mul / RES);
}
// Teeth for the neon sign: the painted 'maw' sprite once the painted UI set is in, else null (vector teethIcon).
function teethArt(scene, x, y, w, h) { return HASUI('lips') && HAS('maw') ? fitImg(scene.add.image(x, y, 'maw'), w, h) : null; }
// Love-tester tube behind the segment fills: a Container (depth 19) holding the tube and the zone hearts, or null.
function meterArt(scene, m) {
  if (!HASUI('meter')) return null;
  const ML = UI_LAYOUT.meter, h = m.segH, b = m.mBottom, top = b - (m.zoneMax + 1) * h;
  const y0 = top - ML.padTop, y1 = b + ML.padBot, tall = y1 - y0;
  const c = scene.add.container(m.mx, 0).setDepth(19);
  const cap = scene.add.image(0, y0, 'ui_meter').setOrigin(0.5, 0), fw = cap.width, fh = cap.height, s = ML.w / fw;
  const capPx = Math.round(fh * ML.capFrac);
  if (capPx > 0 && capPx < fh && capPx * s < tall * 0.6) {
    // skull cap at true aspect, the rest of the tube stretched to the meter height
    cap.setScale(s).setCrop(0, 0, fw, capPx);
    const body = scene.add.image(0, y1, 'ui_meter').setOrigin(0.5, 1).setCrop(0, capPx, fw, fh - capPx);
    body.setScale(s, (tall - capPx * s + 1) / (fh - capPx));
    c.add([body, cap]); c.tube = [body, cap];
  } else { cap.setDisplaySize(ML.w, tall); c.add(cap); c.tube = [cap]; }
  c.hearts = [];
  for (let z = m.zoneMin; z <= m.zoneMax; z++) { const hi = uiImg(scene, 'heart', -ML.heartDX, b - z * h + h / 2 - 2, ML.heart, ML.heart, { parent: c }); if (hi) c.hearts.push({ z, im: hi }); }
  return c;

  // pick the card/target with the most heat that cannot bust; fall back to ice on a monster near the skull
  let best = null;

    if (c.sym === 'ice') { if (m.heat > m.zoneMax - 1 && !(m.heat >= m.zoneMin)) best = best || { i, m, score: 0.5 }; return; }

  if (!S.auto || !window.game) return;

  const hold = (ms) => { autoUntil = now + ms; };
  const P = { x: 0, y: 0 }, k = s.scene.key;

  if (k === 'Heist') {

    const smit = s.targets().filter((m) => m.lips);
    const play = s.energy > 0 ? bestPlay(s) : null;
    // smooch when maxed, out of moves, or a ghost would be needed to climb
    const ready = smit.find((m) => m.heat >= m.zoneMax || !play || play.m !== m || Math.random() < 0.25);
    if (ready) { ready.lips.emit('pointerdown', P); return hold(1500); }
    if (play) {
      s.handViews[play.i].emit('pointerdown', P);
      if (s.targets().length > 1) setTimeout(() => { if (s.sel === play.i) play.m.zone.emit('pointerdown', P); }, 350);
      return hold(1900);
    }
    s.endBtn.emit('pointerdown', P); return hold(2600);
  }
  if (k === 'Booth') {
    if (s.busy || s.leaving) return hold(300);
    if (S.tokens >= 2) { s.crank.emit('pointerdown', P); return hold(1200); }
    s.next.emit('pointerdown', P); return hold(1200);
  }
  if (k === 'Results') { if (s.replay && s.replay.scale > 0.9) { s.replay.emit('pointerdown', P); return hold(1500); } return hold(500); }

}

    await new Promise((res) => this.time.delayedCall(700, res));
    S.deck.push(card);
    await new Promise((res) => this.tweens.add({ targets: cv, x: 470, y: 820, scale: 0.2, alpha: 0.4, duration: 400, ease: 'Cubic.In', onComplete: res }));
    cv.destroy(); this.tweens.add({ targets: this.thief, scaleY: 0.66, yoyo: true, duration: 100 });
    this.busy = false;
    if (S.tokens < 2) { this.crank.setAlpha(0.5); this.ghost.move(W / 2 + 14, 870); }
  }
  leave() {
    if (this.busy || this.leaving) return; this.leaving = true; SFX.laugh();
    S.round++; this.cameras.main.fadeOut(300, 22, 11, 30);
    this.time.delayedCall(320, () => this.scene.start('Heist'));
  }
}

class Results extends Phaser.Scene {
  constructor() { super('Results'); }
  create(data) {
    const bgR = background(this, 'fair', data.win ? 'bg_win' : 'bg_stage'); autoButton(this);
    if (data.win && bgR.painted) {
      S.entourage.forEach((e, i) => { const a = -Math.PI / 2 + i * (Math.PI * 2 / Math.max(1, S.entourage.length)); const mc = makeMonster(this, 270 + Math.cos(a) * 176, 236 + Math.sin(a) * 176, e.look, 0.42 / e.look.size); mc.redraw('smitten'); this.tweens.add({ targets: mc, y: mc.y - 6, yoyo: true, repeat: -1, duration: 420 + i * 40 }); });
      const thief = drawThief(this, 170, 820, 1.1); this.time.addEvent({ delay: 900, loop: true, callback: () => thief.twirl() });
      SFX.laugh(); this.time.delayedCall(800, () => SFX.win());
      this.time.addEvent({ delay: 350, loop: true, callback: () => burst(this, Phaser.Math.Between(40, 500), Phaser.Math.Between(60, 300), pick(['pHeart', 'pCoin', 'pSpark']), 16, undefined, { gravityY: 150 }) });
    } else if (data.win) {
      // ride off on the ferris wheel with the whole entourage
      const fx = 420, fy = 420, fr = 118;
      const wheel = this.add.container(fx, fy);
      S.entourage.forEach((e, i) => { const a = i * (Math.PI * 2 / Math.max(1, S.entourage.length)); const mc = makeMonster(this, Math.cos(a) * fr, Math.sin(a) * fr + 20, e.look, 0.3 / e.look.size); mc.redraw('smitten'); wheel.add(mc); });
      this.tweens.add({ targets: wheel, angle: 360, duration: 9000, repeat: -1 });
      this.tweens.addCounter({ from: 0, to: 360, duration: 9000, repeat: -1, onUpdate: () => wheel.list.forEach((c) => (c.angle = -wheel.angle)) });
      const thief = drawThief(this, 170, 800, 1.1); this.time.addEvent({ delay: 900, loop: true, callback: () => thief.twirl() });
      SFX.laugh(); this.time.delayedCall(800, () => SFX.win());
      this.time.addEvent({ delay: 350, loop: true, callback: () => burst(this, Phaser.Math.Between(40, 500), Phaser.Math.Between(100, 350), pick(['pHeart', 'pCoin', 'pSpark']), 16, undefined, { gravityY: 150 }) });
      const lg = this.add.graphics(), kids = [lg];
      if (HASUI('lips') && HASUI('heart')) {
        kids.push(uiImg(this, 'lips', -60, 0, 84, 60), uiImg(this, 'heart', 30, -2, 70, 70));
        const st = symImg(this, 'star', 90, -30, 40); if (st) kids.push(st); else star(lg, 90, -30, 18, N.gold);
      } else { lipsIcon(lg, -60, 0, 34); heart(lg, 30, -6, 32, N.pink); lg.fillStyle(N.gold); star(lg, 90, -30, 18, N.gold); }
      const logo = this.add.container(W / 2 - 60, 160, kids); this.tweens.add({ targets: logo, scale: 1.1, yoyo: true, repeat: -1, duration: 400 });
    } else {
      const sg = this.add.graphics(); sg.fillStyle(N.ink); sg.fillRoundedRect(10, 560, W - 20, 40, 12); sg.fillStyle(0x5a2a3a); sg.fillRoundedRect(16, 562, W - 32, 28, 10);
      const h = pImage(this, -40, 540, 'pHat', 3);
      this.tweens.add({ targets: h, x: W + 60, angle: 720, duration: 3500, repeat: -1, delay: 400 });
      const tg = teethArt(this, 0, 0, 150, 108) || this.add.graphics(); if (tg.type === 'Graphics') teethIcon(tg, 0, 0, 60); const t = this.add.container(W / 2, 300, [tg]);
      this.tweens.add({ targets: t, scaleY: 0.7, yoyo: true, repeat: -1, duration: 250 }); SFX.chomp();
    }
    const replay = iconButton(this, W / 2, data.win ? 640 : 780, 46, N.lime, (rg) => { rg.lineStyle(9, N.ink); rg.beginPath(); rg.arc(0, 0, 20, -2.6, 2.2); rg.strokePath(); rg.fillStyle(N.ink); rg.fillTriangle(-24, -28, -2, -16, -24, -2); }, () => { resetRun(); this.scene.start('Heist'); }, 'btn_replay');
    replay.setScale(0); this.tweens.add({ targets: replay, scale: 1, duration: 500, delay: 1200, ease: 'Back.Out' });
    this.replay = replay;
  }
}

window.game = new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', backgroundColor: '#160b1e',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: W * RES, height: H * RES },
  callbacks: { postBoot: (g) => g.scene.scenes.forEach((sc) => sc.events.on('create', () => { sc.cameras.main.setZoom(RES).centerOn(W / 2, H / 2); })) },
  scene: [Boot, Title, Heist, Booth, Results],
});
</script>
</body>
