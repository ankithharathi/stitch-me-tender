<script>
const W = 540, H = 960;
const C = {
  sky: 0x2b1f3a, sky2: 0x47305e, ground: 0xc9a26b, ground2: 0xa9824f, rust: 0xb5532b,
  green: 0x7be05a, magenta: 0xff4fa3, bone: 0xf3ead7, pink: 0xff6b8b, bolt: 0xffd23f,
  red: 0xe23b3b, ink: 0x1b1420, moon: 0xfff4c9, stink: 0x9bd14a, white: 0xffffff,

const RARITY = [C.bone, C.green, C.magenta];
const SKIN = [0x9fd28a, 0xc7a3e0, 0xf2b38a, 0x8fc6d8, 0xd8d27a, 0xe59aa8, 0xb0b8a0];
const SLOTS = ['head', 'torso', 'arms', 'legs'];
const KINDS = ['fang', 'shell', 'heart'];

// ---------- run state ----------
const S = {
  round: 0, devotion: 0, harvested: null, muted: false, auto: false,
  parts: null,

function rnd(n) { return Math.floor(Math.random() * n); }
function pick(a) { return a[rnd(a.length)]; }
function newPart(slot, rarity, kind) {
  return { slot, rarity, level: rarity + 1, kind: kind || pick(KINDS), variant: rnd(3), color: pick(SKIN) };
}
function resetRun() {
  S.round = 0; S.devotion = 0; S.harvested = null;
  S.parts = {
    head: newPart('head', 0, 'fang'), torso: newPart('torso', 0, 'shell'),
    arms: newPart('arms', 0, 'fang'), legs: newPart('legs', 0, 'heart'),

}
resetRun();

// ---------- audio ----------
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'square', v = 0.08, slide = 0, delay = 0) {
  if (S.muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.1, delay = 0, hp = 800) {
  if (S.muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = hp; s.buffer = b; g.gain.value = v;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
const SFX = {
  cackle() { for (let i = 0; i < 7; i++) tone(520 - i * 30 + Math.random() * 60, 0.09, 'square', 0.07, -120, i * 0.11); },
  dig() { noise(0.15, 0.15, 0, 300); tone(90, 0.12, 'sine', 0.2, -40); },
  reveal(r) { [0, 1, 2, 3].slice(0, r + 2).forEach((i) => tone(440 * Math.pow(1.26, i + r * 2), 0.18, 'triangle', 0.09, 0, i * 0.08)); },
  whoosh() { noise(0.2, 0.08, 0, 1500); },
  pop() { tone(660, 0.1, 'sine', 0.12, 400); },
  stink() { tone(70, 0.4, 'sawtooth', 0.12, -30); noise(0.3, 0.05, 0, 200); },
  beat(fast) { tone(60, 0.12, 'sine', 0.3, -20); tone(55, 0.12, 'sine', 0.25, -20, fast ? 0.12 : 0.18); },
  zap() { noise(0.5, 0.25, 0, 2000); tone(1200, 0.4, 'sawtooth', 0.06, -1000); },
  kiss() { tone(900, 0.06, 'sine', 0.15, 600); tone(1400, 0.08, 'sine', 0.1, -500, 0.07); },
  splat() { noise(0.18, 0.2, 0, 400); tone(140, 0.15, 'square', 0.1, -80); },
  boing() { tone(200, 0.4, 'sine', 0.2, 300); },
  block() { tone(300, 0.08, 'square', 0.08); tone(250, 0.1, 'square', 0.08, 0, 0.05); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, 0, i * 0.12)); },
  lose() { [400, 330, 260, 180].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, -30, i * 0.18)); },

// ---------- drawing helpers ----------
function heartPath(g, x, y, s, color, outline = true) {
  if (outline) { g.fillStyle(C.ink); g.fillCircle(x - s * 0.5, y - s * 0.2, s * 0.62); g.fillCircle(x + s * 0.5, y - s * 0.2, s * 0.62); g.fillTriangle(x - s * 1.12, y, x + s * 1.12, y, x, y + s * 1.25); }
  g.fillStyle(color); g.fillCircle(x - s * 0.5, y - s * 0.2, s * 0.5); g.fillCircle(x + s * 0.5, y - s * 0.2, s * 0.5);
  g.fillTriangle(x - s * 0.98, y - s * 0.05, x + s * 0.98, y - s * 0.05, x, y + s * 1.05);
}
function drawIcon(g, kind, x, y, s, color) {
  if (kind === 'heart') heartPath(g, x, y, s * 0.8, color || C.pink);
  else if (kind === 'fang') {
    g.fillStyle(C.ink); g.fillTriangle(x - s * 0.7, y - s * 0.8, x + s * 0.7, y - s * 0.8, x, y + s * 1.0);
    g.fillStyle(color || C.white); g.fillTriangle(x - s * 0.5, y - s * 0.66, x + s * 0.5, y - s * 0.66, x, y + s * 0.7);
  } else if (kind === 'shell') {
    g.fillStyle(C.ink); g.fillRoundedRect(x - s * 0.75, y - s * 0.85, s * 1.5, s * 1.0, s * 0.3); g.fillTriangle(x - s * 0.75, y - s * 0.1, x + s * 0.75, y - s * 0.1, x, y + s * 1.0);
    g.fillStyle(color || 0x6fb6ff); g.fillRoundedRect(x - s * 0.58, y - s * 0.7, s * 1.16, s * 0.8, s * 0.22); g.fillTriangle(x - s * 0.58, y - s * 0.1, x + s * 0.58, y - s * 0.1, x, y + s * 0.78);
  } else if (kind === 'bolt') {
    g.fillStyle(C.ink); g.fillPoints([{ x: x + s * 0.3, y: y - s * 1.1 }, { x: x - s * 0.75, y: y + s * 0.2 }, { x: x - s * 0.05, y: y + s * 0.2 }, { x: x - s * 0.35, y: y + s * 1.1 }, { x: x + s * 0.8, y: y - s * 0.25 }, { x: x + s * 0.1, y: y - s * 0.25 }], true);
    g.fillStyle(color || C.bolt); g.fillPoints([{ x: x + s * 0.18, y: y - s * 0.8 }, { x: x - s * 0.52, y: y + s * 0.08 }, { x: x + s * 0.08, y: y + s * 0.08 }, { x: x - s * 0.18, y: y + s * 0.8 }, { x: x + s * 0.56, y: y - s * 0.15 }, { x: x - s * 0.02, y: y - s * 0.15 }], true);
  } else if (kind === 'skull') {
    g.fillStyle(C.ink); g.fillCircle(x, y - s * 0.15, s * 0.8); g.fillRoundedRect(x - s * 0.5, y + s * 0.2, s, s * 0.6, s * 0.15);
    g.fillStyle(color || C.bone); g.fillCircle(x, y - s * 0.15, s * 0.64); g.fillRoundedRect(x - s * 0.36, y + s * 0.2, s * 0.72, s * 0.45, s * 0.1);
    g.fillStyle(C.ink); g.fillCircle(x - s * 0.25, y - s * 0.15, s * 0.18); g.fillCircle(x + s * 0.25, y - s * 0.15, s * 0.18);
  }
}
function stitches(g, x1, y1, x2, y2, n = 4) {
  g.lineStyle(3, C.ink); g.lineBetween(x1, y1, x2, y2);
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len * 7, ny = dx / len * 7;
  for (let i = 1; i <= n; i++) { const t = i / (n + 1), px = x1 + dx * t, py = y1 + dy * t; g.lineBetween(px - nx, py - ny, px + nx, py + ny); }
}
function face(g, x, y, s, mood) {
  // googly eyes
  const ey = y - s * 0.1;
  g.fillStyle(C.ink); g.fillCircle(x - s * 0.32, ey, s * 0.26); g.fillCircle(x + s * 0.32, ey, s * 0.22);
  g.fillStyle(C.white); g.fillCircle(x - s * 0.32, ey, s * 0.2); g.fillCircle(x + s * 0.32, ey, s * 0.16);
  g.fillStyle(mood === 'angry' ? C.red : C.ink); g.fillCircle(x - s * 0.28, ey + s * 0.04, s * 0.09); g.fillCircle(x + s * 0.35, ey + s * 0.03, s * 0.08);
  if (mood !== 'angry') { g.fillStyle(C.pink, 0.75); g.fillCircle(x - s * 0.55, y + s * 0.22, s * 0.13); g.fillCircle(x + s * 0.55, y + s * 0.22, s * 0.13); }
  g.lineStyle(4, C.ink);
  if (mood === 'sad' || mood === 'angry') { g.beginPath(); g.arc(x, y + s * 0.48, s * 0.2, Math.PI * 1.15, Math.PI * 1.85); g.strokePath(); }
  else { g.beginPath(); g.arc(x, y + s * 0.18, s * 0.22, Math.PI * 0.15, Math.PI * 0.85); g.strokePath(); g.fillStyle(C.white); g.fillTriangle(x - s * 0.12, y + s * 0.36, x - s * 0.02, y + s * 0.36, x - s * 0.07, y + s * 0.5); }
}
// draws a stitched monster into a container; origin at feet center
function makeMonster(scene, x, y, parts, scale = 1, mood = 'happy') {
  const cont = scene.add.container(x, y);
  const g = scene.add.graphics(); cont.add(g);
  const L = parts.legs, T = parts.torso, A = parts.arms, Hd = parts.head;
  const ol = (fn) => { g.fillStyle(C.ink); fn(6); };
  // legs
  const legW = [26, 34, 20][L.variant], legH = [60, 46, 74][L.variant];
  [-30, 30].forEach((lx) => {
    g.fillStyle(C.ink); g.fillRoundedRect(lx - legW / 2 - 4, -legH - 4, legW + 8, legH + 8, 10);
    g.fillStyle(L.color); g.fillRoundedRect(lx - legW / 2, -legH, legW, legH, 8);
    g.fillStyle(C.ink); g.fillEllipse(lx + 6, -2, legW + 26, 20); g.fillStyle(L.color); g.fillEllipse(lx + 6, -4, legW + 16, 12);
  });
  // torso
  const tw = [130, 110, 150][T.variant], th = [110, 130, 96][T.variant], ty = -legH - th / 2 + 10;
  g.fillStyle(C.ink);
  if (T.variant === 1) g.fillEllipse(0, ty, tw + 10, th + 10); else g.fillRoundedRect(-tw / 2 - 5, ty - th / 2 - 5, tw + 10, th + 10, T.variant === 0 ? 30 : 14);
  g.fillStyle(T.color);
  if (T.variant === 1) g.fillEllipse(0, ty, tw, th); else g.fillRoundedRect(-tw / 2, ty - th / 2, tw, th, T.variant === 0 ? 26 : 10);
  g.fillStyle(0x000000, 0.12); g.fillCircle(-tw * 0.2, ty + 10, 14); g.fillCircle(tw * 0.18, ty - 18, 9);
  stitches(g, -tw * 0.35, ty - th * 0.1, tw * 0.3, ty + th * 0.25, 5);
  // arms
  const aw = [24, 32, 18][A.variant], ah = [80, 66, 100][A.variant];
  [-1, 1].forEach((sd) => {
    const ax = sd * (tw / 2 + 4), ay = ty - th * 0.3;
    g.fillStyle(C.ink); g.fillRoundedRect(ax - aw / 2 - 4 + sd * 8, ay - 4, aw + 8, ah + 8, 12);
    g.fillStyle(A.color); g.fillRoundedRect(ax - aw / 2 + sd * 8, ay, aw, ah, 10);
    g.fillStyle(C.ink); g.fillCircle(ax + sd * 8, ay + ah + 4, aw * 0.75 + 4); g.fillStyle(A.color); g.fillCircle(ax + sd * 8, ay + ah + 4, aw * 0.75);
    stitches(g, ax + sd * 8 - aw / 2, ay + 10, ax + sd * 8 + aw / 2, ay + 10, 2);
  });

  const hs = [56, 50, 62][Hd.variant], hy = ty - th / 2 - hs * 0.75;

  if (Hd.variant === 1) g.fillRoundedRect(-hs - 5, hy - hs - 5, hs * 2 + 10, hs * 2 + 10, 16); else g.fillCircle(0, hy, hs + 5);
  g.fillStyle(Hd.color);
  if (Hd.variant === 1) g.fillRoundedRect(-hs, hy - hs, hs * 2, hs * 2, 12); else g.fillCircle(0, hy, hs);
  // neck bolts
  [-1, 1].forEach((sd) => { g.fillStyle(C.ink); g.fillRoundedRect(sd * (hs + 2) - 9, hy + hs * 0.35, 18, 16, 4); g.fillStyle(0x9aa0a8); g.fillRoundedRect(sd * (hs + 2) - 6, hy + hs * 0.35 + 3, 12, 10, 3); });
  stitches(g, -hs * 0.6, hy - hs * 0.62, hs * 0.5, hy - hs * 0.7, 4);
  if (Hd.variant === 2) { // cyclops-ish with tuft
    g.fillStyle(C.ink); g.fillTriangle(-10, hy - hs - 18, 10, hy - hs - 18, 0, hy - hs + 4);

}
function drawScientist(scene, x, y, s = 1, flip = false) {
  const c = scene.add.container(x, y), g = scene.add.graphics(); c.add(g);
  // coat
  g.fillStyle(C.ink); g.fillRoundedRect(-44, -150, 88, 150, 20); g.fillStyle(0xeef2f0); g.fillRoundedRect(-38, -144, 76, 140, 16);
  g.fillStyle(0xc9d3cf); g.fillTriangle(-6, -140, 6, -140, 0, -60);
  g.fillStyle(C.red, 0.7); g.fillCircle(-18, -60, 6); g.fillCircle(20, -40, 4); // suspicious stains
  // head
  g.fillStyle(C.ink); g.fillCircle(0, -184, 40); g.fillStyle(0xf2d2b0); g.fillCircle(0, -184, 34);
  // wild hair
  g.fillStyle(C.ink); for (let i = 0; i < 7; i++) { const a = Math.PI + i * Math.PI / 6; g.fillTriangle(Math.cos(a) * 30, -190 + Math.sin(a) * 30, Math.cos(a) * 58, -194 + Math.sin(a) * 52, Math.cos(a + 0.3) * 30, -190 + Math.sin(a + 0.3) * 30); }
  g.fillStyle(0xf3f3f3); for (let i = 0; i < 7; i++) { const a = Math.PI + i * Math.PI / 6; g.fillTriangle(Math.cos(a) * 30, -190 + Math.sin(a) * 30, Math.cos(a) * 52, -194 + Math.sin(a) * 46, Math.cos(a + 0.25) * 30, -190 + Math.sin(a + 0.25) * 30); }
  // goggles
  g.fillStyle(C.ink); g.fillRect(-36, -196, 72, 8); g.fillCircle(-14, -190, 15); g.fillCircle(14, -190, 15);
  g.fillStyle(C.green); g.fillCircle(-14, -190, 10); g.fillCircle(14, -190, 10); g.fillStyle(C.white); g.fillCircle(-17, -193, 3); g.fillCircle(11, -193, 3);
  // grin
  g.fillStyle(C.ink); g.fillEllipse(0, -162, 34, 14); g.fillStyle(C.white); g.fillRect(-12, -167, 24, 5);
  c.setScale(flip ? -s : s, s);
  return c;
}
function background(scene, tint) {
  const g = scene.add.graphics();
  g.fillGradientStyle(C.sky, C.sky, C.sky2, C.sky2, 1); g.fillRect(0, 0, W, H);
  g.fillStyle(C.moon, 0.15); g.fillCircle(420, 140, 110); g.fillStyle(C.moon); g.fillCircle(420, 140, 72);
  g.fillStyle(0xe8dca8); g.fillCircle(400, 125, 12); g.fillCircle(440, 160, 8);
  // stars
  for (let i = 0; i < 40; i++) { g.fillStyle(C.white, Math.random() * 0.7 + 0.2); g.fillCircle(Math.random() * W, Math.random() * 420, Math.random() * 2 + 0.5); }
  // ruined skyline
  g.fillStyle(0x1f1630); [[0, 420, 60, 140], [55, 380, 50, 180], [100, 440, 70, 120], [380, 400, 40, 160], [415, 360, 60, 200], [470, 430, 70, 130]].forEach(([x, y, w, h]) => g.fillRect(x, y, w, h));
  // pylon
  g.lineStyle(5, 0x1f1630); g.lineBetween(250, 560, 280, 330); g.lineBetween(310, 560, 280, 330); g.lineBetween(240, 380, 320, 380); g.lineBetween(255, 450, 305, 450); g.lineBetween(240, 380, 200, 420);
  // ground
  g.fillStyle(C.ground2); g.fillRect(0, 540, W, H - 540);
  g.fillStyle(C.ground); g.fillEllipse(W / 2, 580, W * 1.6, 120); g.fillRect(0, 580, W, H);
  g.fillStyle(C.ground2, 0.6); for (let i = 0; i < 18; i++) g.fillEllipse(Math.random() * W, 620 + Math.random() * 340, 30 + Math.random() * 40, 8);
  // tires
  [[40, 600], [500, 640]].forEach(([x, y]) => { g.fillStyle(C.ink); g.fillEllipse(x, y, 70, 26); g.fillStyle(0x3a3240); g.fillEllipse(x, y, 30, 10); });
  if (tint) { g.fillStyle(tint, 0.12); g.fillRect(0, 0, W, H); }
  // drifting dust
  for (let i = 0; i < 12; i++) {
    const d = scene.add.circle(Math.random() * W, 500 + Math.random() * 400, 2 + Math.random() * 3, C.ground, 0.5);
    scene.tweens.add({ targets: d, x: d.x + 200, alpha: 0, duration: 4000 + Math.random() * 3000, repeat: -1, delay: Math.random() * 3000 });
  }
  return g;
}
function progressPips(scene) {
  autoButton(scene);
  const g = scene.add.graphics();
  for (let i = 0; i < 3; i++) drawIcon(g, 'skull', W / 2 - 50 + i * 50, 40, 16, i < S.round ? 0x5a5060 : (i === S.round ? C.bone : 0x8a7f8e));
  if (S.round < 3) { const r = scene.add.circle(W / 2 - 50 + S.round * 50, 40, 22); r.setStrokeStyle(4, C.bolt); scene.tweens.add({ targets: r, scale: 1.15, yoyo: true, repeat: -1, duration: 500 }); }

  const mg = scene.add.graphics(); const drawM = () => { mg.clear(); mg.fillStyle(C.ink, 0.6); mg.fillCircle(W - 40, 40, 24); mg.fillStyle(C.bone); mg.fillRect(W - 52, 33, 8, 14); mg.fillTriangle(W - 46, 40, W - 34, 28, W - 34, 52); if (S.muted) { mg.lineStyle(4, C.red); mg.lineBetween(W - 56, 26, W - 24, 54); } else { mg.lineStyle(3, C.bone); mg.beginPath(); mg.arc(W - 30, 40, 8, -0.8, 0.8); mg.strokePath(); } };
  drawM(); scene.add.zone(W - 40, 40, 60, 60).setInteractive().on('pointerdown', () => { S.muted = !S.muted; drawM(); });
}
function ghostHand(scene, x, y) {
  const g = scene.add.graphics();
  g.fillStyle(C.white, 0.85); g.fillRoundedRect(-10, -6, 20, 46, 10); g.fillRoundedRect(-24, 22, 48, 40, 14); g.fillCircle(-18, 26, 9);
  g.lineStyle(3, C.ink, 0.8); g.strokeRoundedRect(-10, -6, 20, 46, 10); g.strokeRoundedRect(-24, 22, 48, 40, 14);
  const c = scene.add.container(x, y, [g]).setDepth(100);
  const tw = scene.tweens.add({ targets: c, y: y + 18, scale: 0.9, yoyo: true, repeat: -1, duration: 450, ease: 'Sine.InOut' });
  c.move = (nx, ny) => { tw.stop(); c.setPosition(nx, ny); c.tw = scene.tweens.add({ targets: c, y: ny + 18, scale: 0.9, yoyo: true, repeat: -1, duration: 450, ease: 'Sine.InOut' }); c.setVisible(true); };
  return c;
}
function burst(scene, x, y, key, n = 12, tint) {
  const p = scene.add.particles(x, y, key, { speed: { min: 120, max: 380 }, angle: { min: 0, max: 360 }, scale: { start: 1, end: 0 }, lifespan: 800, gravityY: 400, quantity: n, emitting: false, tint });
  p.setDepth(90); p.explode(n); scene.time.delayedCall(1200, () => p.destroy());
}
function bigButton(scene, x, y, color, drawFn, onTap, r = 52) {
  const c = scene.add.container(x, y), g = scene.add.graphics();
  g.fillStyle(C.ink); g.fillCircle(0, 6, r + 6); g.fillStyle(color); g.fillCircle(0, 0, r); g.fillStyle(C.white, 0.25); g.fillEllipse(-r * 0.3, -r * 0.4, r * 0.8, r * 0.4);
  c.add(g); const ig = scene.add.graphics(); drawFn(ig); c.add(ig);
  c.setSize(r * 2, r * 2).setInteractive({ useHandCursor: true });
  c.on('pointerdown', () => { scene.tweens.add({ targets: c, scale: 0.85, yoyo: true, duration: 90 }); onTap(); });
  return c;
}


// ---------- autoplay (robot toggle, top-left) ----------
function autoButton(scene) {
  const g = scene.add.graphics().setDepth(300);
  const draw = () => {
    g.clear(); const x = 40, y = 40;
    g.fillStyle(C.ink, 0.6); g.fillCircle(x, y, 24);
    if (S.auto) { g.lineStyle(4, C.green); g.strokeCircle(x, y, 26); }
    g.lineStyle(3, S.auto ? C.green : C.bone); g.lineBetween(x, y - 12, x, y - 18); g.fillStyle(S.auto ? C.green : C.bone); g.fillCircle(x, y - 19, 3);
    g.fillRoundedRect(x - 13, y - 11, 26, 22, 6);
    g.fillStyle(C.ink); g.fillCircle(x - 6, y - 2, 3.5); g.fillCircle(x + 6, y - 2, 3.5); g.fillRect(x - 6, y + 5, 12, 2);
  };
  draw();
  scene.add.zone(40, 40, 64, 64).setInteractive().setDepth(301).on('pointerdown', (p, lx, ly, ev) => {
    ac(); S.auto = !S.auto; draw(); if (ev && ev.stopPropagation) ev.stopPropagation();

let autoUntil = 0;
function autoStep() {
  if (!S.auto || !window.game) return;
  const now = performance.now(); if (now < autoUntil) return;
  const s = game.scene.getScenes(true)[0]; if (!s) return;
  const hold = (ms) => { autoUntil = now + ms; };
  const P = { x: 0, y: 0 };
  const live = () => s.children.list.filter((o) => o.input && o.input.enabled && o.active);
  const k = s.scene.key;
  if (k === 'Title') { s.input.emit('pointerdown', P); return hold(1200); }
  if (k === 'Dig') {
    if (s.zapping) return hold(300);
    const mounds = live().filter((o) => o.type === 'Container' && o.width === 150);
    if (mounds.length) { mounds[0].emit('pointerdown', P); return hold(900); }
    const cards = live().filter((o) => o.type === 'Container' && o.width === 124);
    if (cards.length) { // apply rarest last so it wins its slot
      cards.sort((a, b) => (a.partRarity || 0) - (b.partRarity || 0)); cards[0].emit('pointerdown', P); return hold(800);
    }
    if (s.lever) { s.lever.emit('pointerdown', P); return hold(2200); }
    return hold(300);
  }
  if (k === 'Date') {
    if (s.done || s.busy) return hold(250);
    if ((s.jar >= 4 || s.stinks >= 2) && s.jar > 0) { s.kiss.emit('pointerdown', P); return hold(2500); }
    s.sack.emit('pointerdown', P); return hold(1000);
  }
  if (k === 'Battle') {
    if (s.over || s.busy || !s.handViews) return hold(300);
    if (s.energy > 0 && s.handViews.length) {
      let i = 0;
      const wantBlock = s.intent && s.intent.kind === 'fang' && s.intent.n >= 2 && s.block === 0;
      const sh = s.handCards.findIndex((c) => c.kind === 'shell'), ht = s.handCards.findIndex((c) => c.kind === 'heart' && S.devotion >= 2);
      if (wantBlock && sh >= 0) i = sh; else if (ht >= 0) i = ht; else { const f = s.handCards.findIndex((c) => c.kind !== 'shell'); i = f >= 0 ? f : 0; }
      s.handViews[i].emit('pointerdown', P); return hold(700);
    }
    s.endBtn.emit('pointerdown', P); return hold(1600);
  }
  if (k === 'Results') { if (s.replay && s.replay.scale > 0.9) { s.replay.emit('pointerdown', P); return hold(1500); } return hold(500); }
  hold(300);
}
setInterval(autoStep, 120);

    else { og.fillCircle(80, 290, 28); og.fillRoundedRect(50, 318, 60, 96, 16); og.fillStyle(C.red); og.fillCircle(70, 288, 7); og.fillCircle(90, 288, 7); og.fillStyle(0x1f1630); og.fillRect(56, 254, 48, 14); og.fillRect(66, 220, 28, 36); }
    // player monster
    this.me = makeMonster(this, 230, 740, S.parts, 0.55);
    // devotion orbit
    this.orbit = []; for (let i = 0; i < S.devotion; i++) this.orbit.push(this.add.image(230, 640, 'pHeart').setScale(0.9));

    this.endBtn.setDepth(30);

  }
  update() {
    if (!this.orbit) return;

    this.orbit.forEach((h, i) => { const a = this.orbitT + i * (Math.PI * 2 / Math.max(1, this.orbit.length)); h.setPosition(this.me.x + Math.cos(a) * 90, 650 + Math.sin(a) * 24); h.setDepth(Math.sin(a) > 0 ? 15 : 5); });
  }
  buildDeck() {

  }

  newIntent() {
